<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Regjistrimi i hyrjeve dhe daljeve</title>
</head>

<body>
  <h2 style="text-align: center;">Regjistrimi i shitjeve dhe Shpenzimeve</h2>


  <div class="container">
    <h4 style="text-align: center;">Bilanci</h4>
    <h1 id="balance" style="text-align: center;">$0.00</h1>
    <div class="inc-exp-container">
      <div>
        <h4>Hyrje</h4>
        <p id="money-plus" class="money plus">+$0.00</p>
      </div>
      <div>
        <h4>Dalje</h4>
        <p id="money-minus" class="money minus">-$0.00</p>
      </div>
    </div>
    <input type="text" id="searchInput" placeholder="Kerko shitjet...">
    <h3>Historia</h3>
    <ul id="list" class="list">
      <!-- Transaction items will be dynamically added here -->
      <!-- Example: <li class="minus">Cash <span>-$400</span><button class="delete-btn">x</button></li> -->
    </ul>
    <h3>Shto Transaksion</h3>
    <form id="form">
      <div class="form-control">
        <label for="text">Text</label>
        <input type="text" id="text" placeholder="Enter text..." required>
      </div>
      <div class="form-control">
        <label for="amount">Shuma (negativ - shpenzim, pozitiv - të ardhura)</label>
        <input type="number" step="any" id="amount" placeholder="Enter amount..." required>

      </div>
      <button class="btn">Shto transaksion</button>
      <button class="btn  btnSave">Ruaj</button>



    </form>
    <button class="btn btnDelete">Fshi</button>
    <button class="btn btnSaveBalance" type="submit">Ruaj Bilancin</button>
    <button class="btn" id="exportButton">Export to CSV</button>
    <input type="file" id="importInput" accept=".csv">
    <button class="btn" id="importButton">Import from CSV</button>

    <div class="balance-container" style="text-align: center;">
      <h3>Bilanci per Date</h3>
      <ul id="balanceList" class="balanceList"></ul>
      <div id="totalBalance">0</div>
      <button class="btn btnDeleteBalance" type="submit">Fshi bilancin e fundit per date</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>

  <script src="script.js"></script>

</body>

</html>
